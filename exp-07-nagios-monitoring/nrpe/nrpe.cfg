# /opt/homebrew/etc/nrpe.cfg  - lines changed from the Homebrew default
# (original kept as nrpe.cfg.bak)

# Allow the Nagios container: Docker Desktop VM range + default bridge network
allowed_hosts=127.0.0.1,::1,192.168.65.0/24,172.17.0.0/16

# Command definitions corrected for macOS:
#  - check_users      unchanged
#  - check_load       default thresholds (.15/.10/.05) were permanently CRITICAL
#  - check_root       default pointed at /dev/hda1, which does not exist on macOS
#  - check_total_procs default 150/200 is exceeded by macOS even when idle
command[check_users]=/opt/homebrew/sbin/check_users -w 5 -c 10
command[check_load]=/opt/homebrew/sbin/check_load -r -w 5,4,3 -c 10,8,6
command[check_root]=/opt/homebrew/sbin/check_disk -w 20% -c 10% -p /
command[check_total_procs]=/opt/homebrew/sbin/check_procs -w 600 -c 800
