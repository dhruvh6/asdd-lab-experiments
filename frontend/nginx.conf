server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The React app handles its own routes (/orders/12, /kitchen ...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the backend container over the Compose network.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
