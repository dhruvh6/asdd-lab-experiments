# CampusEats - full stack: app + database + cache + monitoring.
#   docker compose up -d --build      start everything
#   docker compose ps                 status of every service
#   docker compose down               stop (data in the mysql-data volume is kept)

name: campuseats

services:
  mysql:
    image: mysql:8.0
    container_name: campuseats-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: campuseats
      MYSQL_USER: campuseats
      MYSQL_PASSWORD: ${DB_PASSWORD:-campuseats}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucampuseats", "-p${DB_PASSWORD:-campuseats}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campuseats-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: campuseats-backend:${APP_VERSION:-dev}
    container_name: campuseats-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: campuseats
      DB_PASSWORD: ${DB_PASSWORD:-campuseats}
      DB_NAME: campuseats
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-campuseats-demo-secret-change-me}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: campuseats-frontend:${APP_VERSION:-dev}
    container_name: campuseats-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: campuseats-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: campuseats-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-campuseats}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/campuseats.json
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
