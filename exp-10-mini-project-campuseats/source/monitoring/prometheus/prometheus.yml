global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: campuseats-api
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:4000']
        labels:
          app: campuseats

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
