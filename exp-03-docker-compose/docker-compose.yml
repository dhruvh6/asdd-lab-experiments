version: '3.8'

services:

  web:
    image: nginx
    container_name: webserver
    ports:
      - "8080:80"

  database:
    image: mysql:8.0
    container_name: mysqlserver
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: studentdb
      MYSQL_USER: student
      MYSQL_PASSWORD: student123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  apache:
    image: httpd
    container_name: apacheserver
    ports:
      - "8081:80"

  cache:
    image: redis
    container_name: redisserver
    ports:
      - "6379:6379"

volumes:
  mysql-data:
