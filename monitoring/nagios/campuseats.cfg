###############################################################################
# CampusEats - Nagios object definitions (mounted into /opt/nagios/etc/monitor)
#
# Nagios runs inside the Compose network, so each container is reached by its
# service name. The Mac running the stack is monitored through the NRPE agent
# set up in Experiment 7 (listening on port 5666).
###############################################################################

define command {
    command_name    check_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

# HTTP check that also requires a string in the response body. Thresholds are
# generous because this Nagios image runs under amd64 emulation on Apple Silicon.
define command {
    command_name    check_http_body
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -s $ARG3$ -w $ARG4$ -c $ARG5$
}

define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 0.5 -c 2
}

define hostgroup {
    hostgroup_name  campuseats-stack
    alias           CampusEats application stack
    members         campuseats-frontend,campuseats-backend,campuseats-mysql,campuseats-redis
}

# ---------------------------------------------------------------- containers

define host {
    use         linux-server
    host_name   campuseats-frontend
    alias       React app served by Nginx
    address     frontend
}

define host {
    use         linux-server
    host_name   campuseats-backend
    alias       Node.js REST API
    address     backend
    parents     campuseats-mysql,campuseats-redis
}

define host {
    use         linux-server
    host_name   campuseats-mysql
    alias       MySQL 8 database
    address     mysql
}

define host {
    use         linux-server
    host_name   campuseats-redis
    alias       Redis cache
    address     redis
}

define service {
    use                     generic-service
    host_name               campuseats-frontend
    service_description     Web app HTTP
    check_command           check_http_body!80!/nginx-health!ok!2!5
    check_interval          1
    retry_interval          1
}

define service {
    use                     generic-service
    host_name               campuseats-backend
    service_description     API health
    check_command           check_http_body!4000!/api/health!UP!2!5
    check_interval          1
    retry_interval          1
}

define service {
    use                     generic-service
    host_name               campuseats-backend
    service_description     Menu endpoint
    check_command           check_http_body!4000!/api/menu!price!2!5
    check_interval          1
    retry_interval          1
}

define service {
    use                     generic-service
    host_name               campuseats-mysql
    service_description     MySQL port 3306
    check_command           check_tcp_port!3306
    check_interval          1
    retry_interval          1
}

define service {
    use                     generic-service
    host_name               campuseats-redis
    service_description     Redis port 6379
    check_command           check_tcp_port!6379
    check_interval          1
    retry_interval          1
}

# ------------------------------------------------- host machine (via NRPE)

define host {
    use         linux-server
    host_name   Mac_Host_001
    alias       macOS host running Docker and Jenkins
    address     host.docker.internal
}

define service {
    use                     generic-service
    host_name               Mac_Host_001
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
}

define service {
    use                     generic-service
    host_name               Mac_Host_001
    service_description     Jenkins port 8080
    check_command           check_tcp_port!8080
}

define service {
    use                     generic-service
    host_name               Mac_Host_001
    service_description     Root Partition
    check_command           check_nrpe!check_root
}

define service {
    use                     generic-service
    host_name               Mac_Host_001
    service_description     CPU Load
    check_command           check_nrpe!check_load
}

define service {
    use                     generic-service
    host_name               Mac_Host_001
    service_description     Total Processes
    check_command           check_nrpe!check_total_procs
}

define service {
    use                     generic-service
    host_name               Mac_Host_001
    service_description     Current Users
    check_command           check_nrpe!check_users
}
